<footer class="footer" role="contentinfo">
    <div class="footer__inner">
        <div class="footer__content">
            <span>&copy; {{ now.Format "2006" }} <a href="{{ .Site.BaseURL }}">{{ .Site.Params.author.name | default "Dhruv Patel" }}</a></span>
            {{ if .Site.Copyright }}
                <span class="footer-license">{{ .Site.Copyright | safeHTML }}</span>
            {{ end }}
            <span class="footer-links">
                <a href="/sitemap/">Sitemap</a>
                {{- if not .Site.Params.disableRSS }}
                <a href="{{ "posts/index.xml" | absLangURL }}" target="_blank" rel="noopener noreferrer" title="RSS Feed" aria-label="Subscribe to RSS Feed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 11a9 9 0 0 1 9 9"></path>
                        <path d="M4 4a16 16 0 0 1 16 16"></path>
                        <circle cx="5" cy="19" r="1"></circle>
                    </svg>
                    <span>RSS</span>
                </a>
                {{- end }}
            </span>
        </div>
    </div>
    <div class="footer__inner">
        <div class="footer__content">
            <span>Android Architect &bull; Kotlin Multiplatform &bull; On-Device AI</span>
            <span>Powered by <a href="https://gohugo.io" target="_blank" rel="noopener noreferrer">Hugo</a></span>
        </div>
    </div>
</footer>
