<header class="header" role="banner">
    <div class="header__inner">
        {{ partial "logo.html" . }}

        <div class="header__right">
            {{- if len .Site.Menus }}
                {{ partial "menu.html" . }}
                <button type="button" class="menu-trigger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="site-navigation">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
                        <path d="M0 0h24v24H0z" fill="none"/>
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
                    </svg>
                </button>
            {{- end }}

            {{- if .Site.Params.EnableThemeToggle }}
                <button type="button" class="theme-toggle not-selectable" aria-label="Toggle light and dark color theme">
                    {{ partial "theme-toggle-icon.html" . }}
                </button>
            {{- end}}
        </div>
    </div>
</header>
