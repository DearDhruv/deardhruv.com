[build]
publish = "dist"
command = "npm run build:astro"

[build.environment]
NODE_VERSION = "24"

[context.production.environment]
NODE_VERSION = "24"

[context.split1]
command = "npm run build:astro"

[context.split1.environment]
NODE_VERSION = "24"

[context.deploy-preview]
command = "npm run build:astro"

[context.deploy-preview.environment]
NODE_VERSION = "24"

[context.branch-deploy]
command = "npm run build:astro"

[context.branch-deploy.environment]
NODE_VERSION = "24"

[context.next.environment]
NODE_VERSION = "24"

[[redirects]]
  from = "/feed.json"
  to = "/index.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[edge_functions]]
  path = "/*"
  function = "markdown-negotiation"

[[headers]]
  for = "/index.json"
  [headers.values]
    Content-Type = "application/feed+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Signal = "search=yes, ai-train=yes, ai-inference=yes"
    Vary = "Accept"
    Link = "</llms.txt>; rel=\"describedby\", </llms-full.txt>; rel=\"help\", </.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/mcp.json>; rel=\"mcp\", </sitemap.xml>; rel=\"sitemap\", </about/>; rel=\"service-doc\", </auth.md>; rel=\"service-doc\", </css/design-system.css?v=2.3.2>; rel=\"preload\"; as=\"style\", </css/typography.css?v=2.3.2>; rel=\"preload\"; as=\"style\", </css/layout.css?v=2.3.2>; rel=\"preload\"; as=\"style\", </css/components.css?v=2.3.2>; rel=\"preload\"; as=\"style\", </css/nav.css?v=2.3.2>; rel=\"preload\"; as=\"style\""

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"

[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/openid-configuration"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/auth.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pp/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"
